version: 2

models:
  - name: mart_activity_daily
    description: "Table with count of attributes per dates."
    catalog: gold
    schema: meetup
    columns: 
      - name: date_key
        description: "Date key with a number format."
        tests:
          - unique
          - not_null
      - name: calendar_date
        description: "Date on calendar."
      - name: week_start
        description: "First day of the week starting on Monday."
      - name: weekday_name
        description: "Day of the week."
      - name: month_start
        description: "First day of the month."
      - name: events_created_count
        description: "Number of events created on that day."
      - name: events_ocurred_count
        description: "Events that happened on that day."
      - name: group_created_count
        description: "Groups created on that day."
      - name: members_joined_group_count
        description: "Memebers that join any group on that day."
      - name: loaded_at
        description: ""

  - name: mart_events_detail
    description: "Table with events with it's praticular details."
    catalog: gold
    schema: meetup

  - name: mart_group_engagement
    description: "Table with behabviour of each group."
    catalog: gold
    schema: meetup

  - name: mart_member_activity
    description: "Table with the activity of every member."
    catalog: gold
    schema: meetup

  - name: mart_topic_trends
    description: "Table with topics with each trends"
    catalog: gold
    schema: meetup
