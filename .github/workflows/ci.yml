name: CI

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch 
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install dbt-databricks

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          dwh:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: meetup
                schema: ci_schema
                host: dbc-10cf7b0c-4f1d.cloud.databricks.com
                http_path: /sql/1.0/warehouses/6268c85844e0cdbe
                threads: 4
                token: "${DATABRICKS_TOKEN}"
EOF
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run dbt
        working-directory: dwh
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          dbt deps
          dbt build --target ci --select state:modified+
